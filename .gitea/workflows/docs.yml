name: Docs Sync

# Mirrors tChirp's docs into the live site repo (TIMMYG-Studios/tWeb =
# timmygstudios.com). tChirp is hosted on GITEA, so it is a PUSH product: this
# workflow runs here and writes into tWeb.
#
# ── ⚠️ WHY THAT DISTINCTION IS THE WHOLE POINT ───────────────────────────────
#
# tWeb also carries a `sync-github-docs.yml` that PULLS docs, and it exists
# because two products got this wrong. tLib and tDB live on GitHub, each carried
# a `.gitea/workflows/docs.yml` exactly like this one, and neither had ever
# executed a single time — a Gitea pull mirror does not fire Actions, only real
# pushes do. The measured result was that tWeb held 3 of tLib's 5 doc pages,
# frozen at a months-old commit, and had never received tDB's docs at all.
# Nothing failed. The pages simply stopped arriving.
#
# So the one thing to verify after the first push is that this workflow has a
# RUN, not that the docs look right. A sync that has never executed and a sync
# that is up to date look identical from tWeb.
#
# Self-contained on purpose (see tRadio and tRadar): the shared reusable workflow
# is served stale by act_runner's ref cache, so inlining the steps is the
# reliable path.
#
# ── Secrets ──────────────────────────────────────────────────────────────────
#
# `REPO_TOKEN` must have write access to TIMMYG-Studios/tWeb. It is an
# organisation-level Actions secret on the TIMMYG-Studios org in Gitea, shared
# with every other product's Docs Sync — nothing about it is per-repository, but
# a NEW repository still has to be able to read org secrets for it to resolve.
# If this job fails at the tWeb checkout with an empty token, that is the setting
# to check, not the token itself.

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tChirp (source)
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 1

      # ⚠️ BEFORE the tWeb checkout, so a bad page cannot be pushed at all.
      #
      # This job replaces src/content/docs/tChirp/ in tWeb wholesale and pushes.
      # tWeb's own CI then runs — AFTER the commit has landed — so without this
      # step the first thing to notice a broken cross-page anchor is the live
      # site. tChirp's pages carry four of those links, which is exactly what a
      # renamed heading silently breaks.
      #
      # No `bun install`: check-docs.mjs imports only node builtins, deliberately,
      # so this step is a checkout and a run. Same property as secrets.yml.
      - name: Set up bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Every page has frontmatter and every link resolves
        run: bun scripts/check-docs.mjs

      - name: Checkout tWeb (docs target)
        uses: https://github.com/actions/checkout@v4
        with:
          repository: TIMMYG-Studios/tWeb
          token: ${{ secrets.REPO_TOKEN }}
          path: tWeb
          fetch-depth: 1

      - name: Sync documentation + media
        env:
          SLUG: tChirp
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Docs: a docs-only directory in tWeb, safe to replace wholesale, which
          # is what makes a DELETED page actually disappear from the site rather
          # than linger with no source.
          mkdir -p "tWeb/src/content/docs/$SLUG"
          rm -rf "tWeb/src/content/docs/$SLUG"/*
          cp docs/content/*.mdx "tWeb/src/content/docs/$SLUG/"

          # Media: public/assets/$SLUG is SHARED with the software/marketing page,
          # so overlay-copy only (never wipe) — software-only media must survive.
          # tChirp ships no media today; the block is here so the first screenshot
          # added to docs/public/ lands without anyone remembering this file.
          if [ -d docs/public ]; then
            mkdir -p "tWeb/public/assets/$SLUG"
            cp -r docs/public/. "tWeb/public/assets/$SLUG/"
          fi

      - name: Sync release notes
        env:
          CHANGELOG_DIR: tchirp
        run: |
          set -euo pipefail
          shopt -s nullglob
          SRC="docs/changelog"
          DEST="tWeb/src/content/changelog/$CHANGELOG_DIR"

          # ⚠️ AN ABSENT SOURCE DIRECTORY IS NOT AN EMPTY ONE.
          #
          # tWeb holds this product's release notes until this repo takes them
          # over, and the take-over is a move: the notes have to land in
          # docs/changelog here before this step can own them. Replacing $DEST
          # wholesale while $SRC does not exist would delete every published note
          # for this product, in a commit whose message says "sync from source"
          # and whose diff nobody reads. Skipping is the only safe reading of
          # "this repo has nothing to say yet" — and tChirp is exactly that case
          # today, so this step is expected to skip on the first run.
          if [ ! -d "$SRC" ] || [ -z "$(find "$SRC" -name '*.mdx' -type f -print -quit)" ]; then
            echo "No $SRC/*.mdx — leaving tWeb's existing notes for $CHANGELOG_DIR alone."
            exit 0
          fi

          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC"/*.mdx "$DEST/"

          # tWeb's build throws if a note's directory and its `product`
          # frontmatter disagree. Checking it here too costs four lines and fails
          # the run that introduced it, next to the diff that caused it, instead
          # of the next unrelated push to tWeb.
          for f in "$DEST"/*.mdx; do
            product=$(sed -n 's/^product:[[:space:]]*//p' "$f" | head -1 | tr -dc 'a-z0-9')
            if [ "$product" != "$CHANGELOG_DIR" ]; then
              echo "::error::$(basename "$f") declares product '$product' but syncs into $CHANGELOG_DIR/."
              exit 1
            fi
          done
          echo "Synced $(ls -1 "$DEST"/*.mdx | wc -l) release note(s)."

      - name: Sync product page
        env:
          PRODUCT_SLUG: tchirp
          ASSET_DIR: tChirp
        run: |
          set -euo pipefail
          SRC="docs/product.mdx"
          DEST="tWeb/src/content/software/$PRODUCT_SLUG.mdx"

          # ⚠️ docs/product.mdx EXISTS as of 2026-10-16, so this step is live and
          # THIS REPOSITORY NOW OWNS THE STOREFRONT PAGE. Every push that touches
          # docs/ overwrites tWeb's src/content/software/tchirp.mdx wholesale.
          # Edit the listing here; an edit made in tWeb is gone at the next push
          # and the person who made it has no reason to look in this repository.
          #
          # The absent-source guard below is kept: it is what made adding the file
          # a deliberate act rather than a surprise, and it is the rollback path.
          if [ ! -f "$SRC" ]; then
            echo "No $SRC — leaving tWeb's existing product page for $PRODUCT_SLUG alone."
            exit 0
          fi

          # Frontmatter only, for the key/slug/pricing checks. The body below the
          # closing --- is MDX and must not be scanned for `amount:`.
          fm=$(awk 'NR==1 && $0=="---" {inside=1; next} inside && $0=="---" {exit} inside {print}' "$SRC")
          if [ -z "$fm" ]; then
            echo "::error::$SRC has no YAML frontmatter block."
            exit 1
          fi

          # tWeb's software collection asserts file name == slug.
          slug=$(printf '%s\n' "$fm" | sed -n 's/^slug:[[:space:]]*//p' | tr -dc 'a-z0-9')
          if [ "$slug" != "$PRODUCT_SLUG" ]; then
            echo "::error::$SRC declares slug '$slug' but syncs to $PRODUCT_SLUG.mdx."
            exit 1
          fi

          for key in name tagline category tags updatedAt popularity provider media pricing; do
            if ! printf '%s\n' "$fm" | grep -q "^$key:"; then
              echo "::error::$SRC is missing required frontmatter key '$key'."
              exit 1
            fi
          done

          # Amounts are minor units (cents). A float is a rounding bug and a
          # string is a build failure, so require a plain integer. `0` passes and
          # is the correct amount for tChirp — free is a price, not a missing one,
          # and a page with no amount at all fails the check above.
          amounts=$(printf '%s\n' "$fm" | sed -n 's/^[[:space:]]*amount:[[:space:]]*//p' | tr -d '"')
          if [ -z "$amounts" ]; then
            echo "::error::$SRC has no pricing tier with an amount."
            exit 1
          fi
          while IFS= read -r a; do
            case "$a" in
              '' | *[!0-9]*)
                echo "::error::pricing amount '$a' is not a non-negative integer (minor units)."
                exit 1
                ;;
            esac
          done <<<"$amounts"

          # Whole file, not just frontmatter: a <ZoomableImage> in the body breaks
          # the live page exactly as silently as a gallery entry does, and a
          # renamed screenshot is the failure that actually happens.
          srcs=$(grep -o '/assets/[A-Za-z0-9._/-]*' "$SRC" | sort -u || true)
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            case "$s" in
              "/assets/$ASSET_DIR"/*)
                rel="docs/public/${s#/assets/$ASSET_DIR/}"
                if [ ! -f "$rel" ]; then
                  echo "::error::$SRC references $s but there is no $rel in this repo."
                  exit 1
                fi
                ;;
              /assets/*)
                echo "::error::$SRC references $s, outside this repo's /assets/$ASSET_DIR/."
                exit 1
                ;;
            esac
          done <<<"$srcs"

          docsurl=$(printf '%s\n' "$fm" | sed -n 's/^docsUrl:[[:space:]]*//p' | tr -d '"')
          if [ -n "$docsurl" ] && ! printf '%s' "$docsurl" | grep -qE '^/docs/[A-Za-z0-9/-]+$'; then
            echo "::error::docsUrl '$docsurl' is not a /docs/... path tWeb will accept."
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          echo "Synced product page -> src/content/software/$PRODUCT_SLUG.mdx"

      - name: Commit + push to tWeb
        env:
          PRODUCT_SLUG: tchirp
          SLUG: tChirp
          CHANGELOG_DIR: tchirp
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          cd tWeb
          git config user.name "Gitea Actions Bot"
          git config user.email "actions@gitea.local"

          git add "src/content/docs/$SLUG/"
          # Only if the media step created it — `git add` on a missing path is a
          # fatal error, which would fail an otherwise good docs sync. tChirp has
          # no docs/public today, so this one does skip.
          if [ -d "public/assets/$SLUG" ]; then
            git add "public/assets/$SLUG/"
          fi
          if [ -d "src/content/changelog/$CHANGELOG_DIR" ]; then
            git add "src/content/changelog/$CHANGELOG_DIR/"
          fi
          if [ -f "src/content/software/$PRODUCT_SLUG.mdx" ]; then
            git add "src/content/software/$PRODUCT_SLUG.mdx"
          fi

          if git diff --staged --quiet; then
            echo "No documentation changes to sync."
          else
            git commit -m "docs($SLUG): sync from source ($ACTOR@${SHA:0:7})"
            git push
          fi
